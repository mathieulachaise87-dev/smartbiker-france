# Questions fréquentes. Elles alimentent aussi les données structurées
# que Google affiche directement dans ses résultats.

questions:
- question: Faut-il un permis spécial pour tracter une remorque porte-moto&#8239;?
  reponse: Non. Avec un PTAC de 450 kg, la remorque SMART BIKER se tracte avec un simple permis B, sans
    formation complémentaire, tant que le total du véhicule tracteur et de la remorque reste sous 3 500
    kg. La remorque est immatriculée et livrée avec sa carte grise.
- question: Peut-on vraiment charger une moto seul, sans rampe et sans aide&#8239;?
  reponse: Oui, c'est la raison d'être du produit. Le plateau s'abaisse jusqu'au sol grâce au système
    intégré, vous poussez la moto dessus et la calez dans le bloque-roue avant, puis vous relevez le plateau
    et vous le verrouillez. Aucune rampe à transporter, aucune deuxième personne nécessaire.
- question: Combien coûte la livraison&#8239;?
  reponse: 'La remorque est au prix de {prix} € TTC en retrait dans l''une de nos trois agences : Limoges
    (87), La Souterraine (23) ou Angoulême (16). La livraison chez vous, partout en France métropolitaine,
    est possible pour {livraison} € TTC supplémentaires. Dans les deux cas, la remorque est livrée déjà
    montée.'
- question: Quelle est la vitesse maximale autorisée avec une remorque moto&#8239;?
  reponse: En France, un véhicule tractant une remorque est limité à 90 km/h sur autoroute et 80 km/h
    sur route, selon la signalisation en vigueur. La remorque SMART BIKER est homologuée pour ces usages.
- question: Quelles motos peut-on transporter sur la remorque SMART BIKER&#8239;?
  reponse: 'Toutes les motos jusqu''à 1 650 mm d''empattement et 325 kg de charge utile : roadsters, trails,
    sportives, customs et gros GT. Le kit MP3 en option permet également de transporter un scooter à trois
    roues.'
- question: Où ranger la remorque quand on n'a qu'un garage&#8239;?
  reponse: Une fois pliée, la remorque se dresse verticalement et tient sur 2 m de haut pour une emprise
    au sol d'environ 1 m². Là où une remorque porte-moto classique occupe 5 à 6 m² en permanence, la SMART
    BIKER se range contre un mur de garage.
- question: En combien de couleurs existe-t-elle&#8239;?
  reponse: 'Quatre coloris au choix : blanc, noir, orange ou bleu. Les jantes sont disponibles en acier
    ou en aluminium.'
