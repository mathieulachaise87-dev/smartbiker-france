  - id: "prix"
    fond: clair
    kicker: "Tarif"
    titre: "Prix et options"
    contenu:
      - type: bloc_prix
        sous_prix: "Retrait dans l'une de nos trois agences · Carte grise fournie"
        ligne_livraison: "Livraison chez vous, France métropolitaine"
        inclus:
          - "Remorque complète et homologuée, **livrée déjà montée**"
          - "Système d'abaissement et de levage intégré"
          - "Bloque-roue avant et dix points d'arrimage"
          - "Carte grise fournie, prête à rouler"
          - "Garantie constructeur et pièces détachées disponibles"
        options:
          - "Kit MP3"
          - "Jantes aluminium"
          - "Kit antivol"
          - "Sangles rétractables"
          - "Roue de secours"
          - "Coloris au choix"
        colonne:
