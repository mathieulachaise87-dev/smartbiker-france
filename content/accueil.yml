    fond: sombre
    kicker: "Devis gratuit"
    titre: "Votre remorque porte-moto, prête à partir"
    texte: "Réponse sous 24 heures ouvrées. Dites-nous votre moto et votre département, nous vous indiquons le prix final, options comprises, et le délai."
    contenu:
      - type: boutons
        boutons:
