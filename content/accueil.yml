            texte: "Pour {livraison} € TTC, nous livrons partout en France métropolitaine, à votre domicile ou sur votre lieu de travail, sur rendez-vous. La remorque arrive **déjà montée**, carte grise prête."
          - titre: "Professionnels"
            texte: "Concessions moto, loueurs, circuits et écoles de pilotage&#8239;: conditions dédiées à partir de deux remorques. Précisez-le dans votre demande de devis."

  - id: "livraison"
    fond: gris
    kicker: "Partout en France"
    titre: "Livraison chez vous, déjà montée"
    chapo: "Nous livrons dans toute la France métropolitaine pour {livraison} € TTC. Vous n'avez rien à assembler&#8239;: la remorque arrive prête à atteler."
    contenu:
      - type: deux_photos
        photos:
          - image: "assets/img/remorque-porte-moto-attelee-sur-route.jpg"
            alt: "Remorque porte-moto SMART BIKER attelée, chargée d'un roadster BMW, sur la route"
          - image: "assets/img/convoi-remorques-porte-moto-livraison.jpg"
            alt: "Deux voitures tractant des remorques porte-moto SMART BIKER chargées de motos"
      - type: villes
        villes: ["Lyon","Bordeaux","Toulouse","Nantes","Marseille","Paris","Lille","Clermont-Ferrand","Poitiers","Limoges","Angoulême","La Souterraine"]

  - id: "faq"
    fond: clair
    kicker: "Questions fréquentes"
    titre: "Tout ce qu'on nous demande avant d'acheter"
    contenu:
